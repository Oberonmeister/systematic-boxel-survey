<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Systematic Boxel Survey</title>
<style>
:root{color-scheme:dark;--bg:#0a1016;--card:#111c25;--line:#2b3e4c;--text:#e5eef3;--muted:#a0b3bf;--accent:#edb66c;--good:#72d5bd;--bad:#f69b9b;--blue:#85baff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#172735;color:var(--text);border-radius:7px;padding:8px 13px;min-height:38px}button:hover{border-color:var(--accent);background:#203343}button:disabled{opacity:.45;cursor:default}.primary{background:var(--accent);border-color:var(--accent);color:#19130c;font-weight:650}.primary:hover{background:#f3c787;color:#19130c}.small{font-size:12px;padding:4px 9px;min-height:29px}.quiet{background:transparent}input,select,textarea{background:#0b151e;border:1px solid #3a5060;border-radius:6px;color:var(--text);padding:9px;max-width:100%}textarea{width:100%;min-height:138px;resize:vertical}input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:18px;height:18px;vertical-align:middle;margin:0 8px 0 0}input[type=number]{width:110px}input[type=text]{width:100%}label{display:block}label.inline{display:inline-flex;align-items:center;gap:3px}h1,h2,h3,p{margin:0}h1{font-size:23px;letter-spacing:-.4px}h2{font-size:21px;margin-bottom:8px}h3{font-size:15px;margin-bottom:9px}p{margin:8px 0;color:var(--muted)}small,.muted{color:var(--muted)}small{font-size:12px}.shell{max-width:1280px;margin:auto;padding:26px 28px 70px}.mast{display:flex;gap:18px;align-items:center;justify-content:space-between;margin-bottom:24px}.eyebrow{font-size:11px;letter-spacing:1.8px;text-transform:uppercase;color:var(--accent);font-weight:700}.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.spacer{flex:1}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px;margin-bottom:18px}.grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,.6fr);gap:18px}.grid>.card{margin-bottom:0}.stack>*+*{margin-top:14px}.steps{display:flex;gap:10px;list-style:none;padding:0;margin:0 0 24px}.steps li{flex:1;padding:9px 12px;border-top:2px solid var(--line);color:var(--muted);font-size:13px}.steps .active{border-color:var(--accent);color:var(--text)}.pill{font-size:12px;border:1px solid var(--line);border-radius:20px;padding:3px 10px;display:inline-block}.good{color:var(--good)}.warn{color:var(--accent)}.bad{color:var(--bad)}.notice{padding:12px 15px;border:1px solid #655239;border-radius:8px;background:#211d17;color:#ecd6b8;margin:12px 0}.notice.error{border-color:#824747;color:#ffc3c3;background:#271b20}.notice.success{border-color:#346e61;color:#b0e8da;background:#102721}.mono{font-family:ui-monospace,Consolas,monospace}.target{font-size:25px;overflow-wrap:anywhere;margin:10px 0 5px;letter-spacing:-.5px}.targetCard{border-top:3px solid var(--accent)}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:14px}.stat strong{display:block;font-size:25px;font-weight:600}.stat small{display:block}.progress{height:5px;border-radius:4px;background:#273744;overflow:hidden;margin:15px 0}.progress span{display:block;height:100%;background:var(--good)}table{width:100%;border-collapse:collapse;text-align:left;font-size:13px}th{color:var(--muted);font-weight:500;font-size:11px;letter-spacing:.5px;text-transform:uppercase}th,td{padding:11px 9px;border-bottom:1px solid var(--line);vertical-align:middle}td:first-child,th:first-child{padding-left:0}td:last-child,th:last-child{padding-right:0}.tableWrap{overflow:auto}tr.active{background:#22313b}.layer{border:1px solid var(--line);border-radius:8px;margin-top:10px;padding:13px}.layer .mass{font-size:20px;font-weight:600;min-width:25px}.layer details{margin-top:7px}.layer summary{font-size:12px;color:var(--muted);cursor:pointer}.miniList{max-height:260px;overflow:auto;padding-top:9px}.miniList .row{padding:5px 0}.footer{display:flex;justify-content:space-between;gap:12px;margin-top:20px}.field{margin-bottom:15px}.field>span{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.count{color:var(--accent);font-size:19px}.catalogue{padding:10px;border-radius:7px;border:1px solid var(--line);flex:1;min-width:160px}.catalogue strong{display:block}.catalogue small{display:block}.tree{padding-left:15px;border-left:1px solid #4a6070;margin:12px 0}.tree .row{padding:6px 0}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.activity{font-size:12px;color:var(--muted);min-height:23px;margin-bottom:10px}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}:focus-visible{outline:2px solid var(--accent);outline-offset:3px}a{color:var(--blue)}details>summary{cursor:pointer}#toast:empty{display:none}.empty{padding:26px 0;color:var(--muted)}.wrap{overflow-wrap:anywhere}.sourceRadio{padding:10px 12px;border:1px solid var(--line);border-radius:7px}.boundsInput{width:110px!important}.boundName{min-width:230px}#importFile{display:none}.checkLine{margin:10px 0}.log{white-space:pre-wrap;max-height:160px;overflow:auto;font:12px/1.6 ui-monospace,Consolas,monospace;color:var(--muted)}
.confirmationHint{display:block;margin-top:8px}.sequenceRows{max-height:430px;overflow:auto}.sequenceRows thead{position:sticky;top:0;background:var(--card);z-index:1}
@media(max-width:800px){.shell{padding:18px 14px 45px}.grid{grid-template-columns:1fr}.mast{align-items:flex-start}.steps{gap:3px}.steps li{font-size:11px;padding:8px 4px}.stats{grid-template-columns:repeat(2,1fr)}.card{padding:16px}.target{font-size:21px}.mast .toolbar{justify-content:flex-end}th,td{padding:9px 6px}}
</style></head><body><main class="shell"><header class="mast"><div><div class="eyebrow">JACoB extension · 1.0.7</div><h1>Systematic Boxel Survey</h1><p>Choose a scope. Work through every sequence.</p></div><div class="toolbar"><span id="connection" class="pill">Connecting…</span><button id="export" class="small quiet">Export backup</button><button id="import" class="small quiet">Import backup</button><button id="reset" class="small quiet">Reset tab to defaults</button></div></header><div id="toast" role="status" aria-live="polite"></div><div id="activity" class="activity" aria-live="polite"></div><div id="app"></div><input id="clipboardFile" type="file" accept=".json,application/json" hidden><input id="importFile" type="file" accept=".json,application/json"></main>
<script>/* MODEL */</script><script>/* BRIDGE */</script><script>/* UI */</script>
</body></html>
